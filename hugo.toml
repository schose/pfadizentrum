# Hugo-Konfiguration - 1:1 Nachbau des WordPress-Auftritts pfadizentrum.de
# Original: Theme "Rife Free" 2.4.21 (Apollo13 Framework) auf WordPress 6.8.2

baseURL = 'https://www.pfadizentrum.de/'
languageCode = 'de-DE'
defaultContentLanguage = 'de'
title = 'Pfadizentrum Drei Gleichen'
enableRobotsTXT = true
disableHugoGeneratorInject = true
disableKinds = ['taxonomy', 'term']

# Ausgabe-Struktur wie WordPress: /seite/index.html
[permalinks]
  page = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Pfadfinderzentrum Drei Gleichen - Zeltplatz und Freizeitheim in der Mitte Thüringens"
  titleBarBg = "/wp-content/uploads/2025/04/pfadizentrum.jpg"

  [params.apolloParams]
    ajaxurl = ""
    site_url = "/"
    defimgurl = "/wp-content/themes/rife-free/images/holders/photo.png"
    options_name = "apollo13_option_rife"
    load_more = "Mehr laden"
    loading_items = "Laden der nächsten Elemente"
    anchors_in_bar = "1"
    scroll_to_anchor = "1"
    writing_effect_mobile = ""
    writing_effect_speed = "10"
    hide_content_under_header = "title"
    default_header_variant = "normal"
    header_sticky_top_bar = ""
    header_color_variants = "sticky"
    show_header_at = "0"
    header_normal_social_colors = "color|black_hover||_hover"
    header_light_social_colors = "|_hover||_hover"
    header_dark_social_colors = "|_hover||_hover"
    header_sticky_social_colors = "semi-transparent|color_hover||_hover"
    close_mobile_menu_on_click = "1"
    menu_overlay_on_click = ""
    allow_mobile_menu = "1"
    submenu_opener = "fa-angle-down"
    submenu_closer = "fa-angle-up"
    submenu_third_lvl_opener = "fa-angle-right"
    submenu_third_lvl_closer = "fa-angle-left"
    posts_layout_mode = "packery"
    products_brick_margin = "0"
    products_layout_mode = "packery"
    albums_list_layout_mode = "packery"
    album_bricks_thumb_video = ""
    works_list_layout_mode = "packery"
    work_bricks_thumb_video = ""
    people_list_layout_mode = "fitRows"
    lg_lightbox_share = "1"
    lg_lightbox_controls = "1"
    lg_lightbox_download = ""
    lg_lightbox_counter = "1"
    lg_lightbox_thumbnail = "1"
    lg_lightbox_show_thumbs = ""
    lg_lightbox_autoplay = "1"
    lg_lightbox_autoplay_open = ""
    lg_lightbox_progressbar = "1"
    lg_lightbox_full_screen = "1"
    lg_lightbox_zoom = "1"
    lg_lightbox_mode = "lg-slide"
    lg_lightbox_speed = "600"
    lg_lightbox_preload = "1"
    lg_lightbox_hide_delay = "2000"
    lg_lightbox_autoplay_pause = "5000"
    lightbox_single_post = ""

  [[params.socials]]
    slug = "mailto"
    icon = "fa-envelope-o"
    title = "E-mail"
    url = "mailto:info@pfadizentrum.de"

  [[params.socials]]
    slug = "facebook"
    icon = "fa-facebook"
    title = "Facebook"
    url = "https://www.facebook.com/pfadizentrum.de"

  [[params.socials]]
    slug = "googleplus"
    icon = "fa-google-plus"
