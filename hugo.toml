# Hugo-Konfiguration - 1:1 Nachbau des WordPress-Auftritts pfadizentrum.de
# Original: Theme "Rife Free" 2.4.21 (Apollo13 Framework) auf WordPress 6.8.2

baseURL = 'https://www.pfadizentrum.de/'
locale = 'de-DE'
defaultContentLanguage = 'de'
title = 'Pfadizentrum Drei Gleichen'
enableRobotsTXT = true
disableHugoGeneratorInject = true
disableKinds = ['taxonomy', 'term']

# Ausgabe-Struktur wie WordPress: /seite/index.html
[permalinks]
  page = "/:slug/"

[markup.goldmark.renderer]
  unsafe = true
  # Eine neue Zeile im Markdown ist auch im Ergebnis eine neue Zeile.
  hardWraps = true

# Einzelne Zeilenumbrueche im Markdown werden zu <br> - so, wie es Autorinnen
# und Autoren aus Word/WordPress erwarten (Adressen, Preislisten).
[markup.goldmark.extensions]
  [markup.goldmark.extensions.typographer]
    disable = true
[markup.goldmark.parser]
  # Ein Bild, das allein in einer Zeile steht, wird nicht in <p> eingepackt -
  # sonst landet das <figure> des Render-Hooks in einem Absatz.
  wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true

# Die Bilder liegen weiterhin unter static/wp-content/uploads (URLs bleiben
# stabil), sind zusaetzlich aber als Hugo-Ressourcen erreichbar. Dadurch kann
# der Bild-Render-Hook die responsiven Groessen selbst erzeugen - wer ein Foto
# einstellt, legt nur noch EINE Datei ab.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/wp-content/uploads"
    target = "assets/uploads"

# Inhalte sind Markdown. text/html bleibt erlaubt, damit alte Seiten
# im WordPress-Export-Format weiterhin gebaut werden koennen.
[security]
  allowContent = ['^text/html$', '^text/markdown$', '^text/x-org$', '^text/asciidoc$', '^text/plain$']

