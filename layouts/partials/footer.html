<footer id="footer" class="to-move full centered footer-separator" itemscope itemtype="https://schema.org/WPFooter">
	<div class="foot-widgets three-col dark-sidebar">
		<div class="foot-content clearfix">
{{- range site.Params.footerWidgets -}}
	{{ printf `<div id="block-%s" class="widget widget_block widget_text">%s</div>` .id .html | safeHTML }}
{{- end -}}
</div>
	</div>
	<div class="foot-items">
		<div class="foot-content clearfix">
			<div class="f-links">
				{{- partial "socials.html" (dict "variant" "white color_hover") }}
			</div>
		</div>
	</div>
</footer>
